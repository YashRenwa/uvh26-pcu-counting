# Single source of truth for every tunable number. Frozen at the end of Phase 1;
# after that, ask before changing anything here (see CLAUDE.md).
# Values marked "decide" are proposals from the execution plan, not yet decisions.

seed: 42

# Relative paths resolve against the repo root. Each can be overridden by an env var
# (shown on the right) so Colab can point at Google Drive without editing this file.
paths:
  raw_root: data/raw          # UVH_RAW_ROOT: Hub downloads (JSONs, original PNGs). Colab: local disk
  data_root: data/prepared    # UVH_DATA_ROOT: 1280 px JPEGs and caches. Colab: Drive
  labels_root: data/labels    # UVH_LABELS_ROOT: YOLO labels + instance_counts.csv, rebuilt in seconds.
                              # Relative = inside the repo clone, so local disk on Colab (Drive is slow
                              # for thousands of small files)
  runs_root: runs             # UVH_RUNS_ROOT: Ultralytics runs. Colab: Drive
  weights_dir: weights        # UVH_WEIGHTS_DIR: COCO-pretrained .pt files
  datasets_root: data/datasets  # UVH_DATASETS_ROOT: Ultralytics view of the split. Colab: local disk
  splits_dir: splits
  results_dir: results
  tags_file: analysis/phase6_tags.csv   # Phase 6 cause tags, written by the user and committed

dataset:
  repo_id: iisc-aim/UVH-26
  revision: 59f82c57821e8a54dc40bc1f42e83909dbad0b70   # pinned 2026-10-05
  image_dirs:
    train: UVH-26-Train/data
    val: UVH-26-Val/data
  annotations:
    train: {mv: UVH-26-Train/UVH-26-MV-Train.json, st: UVH-26-Train/UVH-26-ST-Train.json}
    val: {mv: UVH-26-Val/UVH-26-MV-Val.json, st: UVH-26-Val/UVH-26-ST-Val.json}
  # COCO category_id k maps to YOLO class k-1, in this order.
  classes: [Hatchback, Sedan, SUV, MUV, Bus, Truck, Three-wheeler, Two-wheeler,
            LCV, Mini-bus, Tempo-traveller, Bicycle, Van, Others]

pool:
  size: 4000                  # decide (Phase 1)
  smoke_size: 20              # CPU smoke tests
  require_both_labels: true   # ST labels cover only 81% of images; the ablation needs both

prepare:
  long_side: 1280
  jpeg_quality: 95

cluster:
  clip_model: openai/clip-vit-base-patch32
  batch_size: 32
  # Link two images (connected components) when the 64x36 gradient-magnitude correlation g >= g_min.
  # Decided 2026-10-05: CLIP and intensity r confused colour/IR, glare and traffic changes; on 88
  # hand-labelled pairs g separated cameras best (AUC 0.97). 0.48 = precision 1.00 on that set and the
  # largest group stays under 2% of the pool (65 images). Phase 1 evidence: results/phase1_*.
  link: {g_min: 0.48}

split:
  # Pre-purge targets. The purge moves ~40% of val/test into train; 60/20/20 lands near 76/12/12
  # and keeps test above min_test_images (decided 2026-10-05; 70/15/15 left test at 277-367).
  ratios: {train: 0.60, val: 0.20, test: 0.20}
  seed_search: 50             # try seeds seed..seed+49, keep the best class balance (label counts only)
  # Purge, applied inside every candidate split: a val/test image with a direct train partner meeting
  # any rule is moved to train with its whole pseudo-camera, repeated until no such pair is left.
  # g >= 0.36 is the lowest threshold that keeps test >= min_test_images at 60/20/20 (recall 0.725 on
  # the labelled pairs; lower thresholds drain test because each image meets ~2,400 train images).
  purge:
    rules: [{g_min: 0.36}]
    unit: group
    passes: 0
  min_test_images: 400        # if the chosen post-purge split has fewer test images, stop and ask
  min_test_instances: 30

train:
  model: yolov8s.pt           # always loaded by explicit path from weights_dir; never a default model
  imgsz: 960
  batch: 8
  # Phase 2 freeze pilot (2026-10-05, T4, 5 epochs each, MV labels, val):
  #   freeze=10: mAP50-95 0.405, mAP50 0.495, 1.72 min/epoch | all trainable: 0.433, 0.519, 1.87 min/epoch
  # Chosen on val mAP50-95 per the plan's rule: all layers trainable (+0.027 for +9% time per epoch).
  freeze: null                # null = all layers trainable
  # Largest count whose worst-case time fits budget_minutes (src.train.epochs_for_budget): the pilot ran
  # without mosaic (5 < close_mosaic), mosaic epochs are costed at mosaic_slowdown x the pilot's 1.87 min.
  # Identical for baseline and ablation.
  epochs: 34
  patience: 10
  close_mosaic: 10            # Ultralytics default, explicit: the last 10 epochs train without mosaic
  mosaic_slowdown: 1.35       # data-pipeline cost of mosaic vs none, measured locally on the train split
  workers: 2
  save_period: 5
  deterministic: true
  cache: false                # Ultralytics warns cache='ram' is non-deterministic
  cls_remap: true             # Ultralytics 8.4 default, made explicit: seeds the Bus, Truck, Bicycle
                              # head rows from COCO by class name (same for baseline and ablation)
  pilot_epochs: 5             # Phase 2 freeze pilot length
  budget_minutes: 90          # one full training run must fit a free Colab T4 session

evaluate:
  iou_nms: 0.7
  conf_sweep: {start: 0.05, stop: 0.70, step: 0.05}
  # Operating confidence per model, chosen on val (lowest mean absolute PCU error per image against
  # count_reference labels) and frozen before the test set is opened. Rule decided 2026-10-06 (per model).
  # FROZEN 2026-10-07 from the val sweep on deduplicated labels (mean true demand 18.48 PCU per image):
  #   mv 0.35: PCU MAE 2.736 (14.8%), bias -0.50 | st 0.35: PCU MAE 2.708 (14.7%), bias -0.88
  conf: {mv: 0.35, st: 0.35}
  count_reference: st         # labels that define true counts: STAPLE, the headline label set (decided 2026-10-06)
  count_agnostic_nms: true    # counting: one box per vehicle (top class, class-agnostic NMS)
  n_boot: 500                 # paired bootstrap resamples (images) for MV-vs-STAPLE confidence intervals

# Passenger Car Units, IRC:106-1990 (Guidelines for Capacity of Urban Roads in Plain Areas), Table 1:
# equivalency factor at [5%, 10% and above] share of the traffic stream; linear interpolation between,
# 5% value below 5%. Values checked against two papers that quote the table; verify against the code itself.
pcu:
  factors:
    two_wheeler: [0.5, 0.75]      # motor cycle or scooter
    car: [1.0, 1.0]               # passenger car, pick-up van
    auto: [1.2, 2.0]              # auto-rickshaw
    lcv: [1.4, 2.0]               # light commercial vehicle
    truck_bus: [2.2, 3.7]         # truck or bus
    tractor: [4.0, 5.0]           # agricultural tractor trailer
    cycle: [0.4, 0.5]
  class_map:                      # UVH-26 class -> IRC category (decided 2026-10-06)
    Hatchback: car
    Sedan: car
    SUV: car
    MUV: car
    Van: car                      # IRC groups pick-up vans with passenger cars
    Bus: truck_bus
    Truck: truck_bus
    Mini-bus: truck_bus           # judgement call: bus (as here) or LCV
    Tempo-traveller: lcv          # judgement call: LCV (as here) or car
    LCV: lcv
    Three-wheeler: auto
    Two-wheeler: two_wheeler
    Bicycle: cycle
    Others: tractor               # card: agricultural, specialised or unconventional vehicles
  composition: {split: train, label_set: st}   # traffic shares that pick the factor column (decided 2026-10-06)

# Phase 6 error analysis on test, with the counting pipeline exactly as evaluated in Phase 5.
errors:
  model: mv                       # model whose failures are analysed. decide (Phase 6)
  label_set: st                   # labels the failures are judged against (headline)
  n_worst: 30                     # alternating: worst by |PCU error|, worst by missed vehicles
  causes:                         # tag key -> cause (execution plan, Phase 6)
    occlusion: dense occlusion
    small: small or distant vehicle
    confusion: fine-grained confusion
    lighting: lighting or glare
    edge: cut off at frame edge
    label: label disagreement (MV vs STAPLE)
    other: other
