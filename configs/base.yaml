# Single source of truth for every tunable number. Frozen at the end of Phase 1;
# after that, ask before changing anything here (see CLAUDE.md).
# Values marked "decide" are proposals from the execution plan, not yet decisions.

seed: 42

# Relative paths resolve against the repo root. Each can be overridden by an env var
# (shown on the right) so Colab can point at Google Drive without editing this file.
paths:
  raw_root: data/raw          # UVH_RAW_ROOT: Hub downloads (JSONs, original PNGs). Colab: local disk
  data_root: data/prepared    # UVH_DATA_ROOT: 1280 px JPEGs + YOLO labels. Colab: Drive
  runs_root: runs             # UVH_RUNS_ROOT: Ultralytics runs. Colab: Drive
  weights_dir: weights        # UVH_WEIGHTS_DIR: COCO-pretrained .pt files
  datasets_root: data/datasets  # UVH_DATASETS_ROOT: Ultralytics view of the split. Colab: local disk
  splits_dir: splits
  results_dir: results

dataset:
  repo_id: iisc-aim/UVH-26
  revision: 59f82c57821e8a54dc40bc1f42e83909dbad0b70   # pinned 2026-10-05
  image_dirs:
    train: UVH-26-Train/data
    val: UVH-26-Val/data
  annotations:
    train: {mv: UVH-26-Train/UVH-26-MV-Train.json, st: UVH-26-Train/UVH-26-ST-Train.json}
    val: {mv: UVH-26-Val/UVH-26-MV-Val.json, st: UVH-26-Val/UVH-26-ST-Val.json}
  # COCO category_id k maps to YOLO class k-1, in this order.
  classes: [Hatchback, Sedan, SUV, MUV, Bus, Truck, Three-wheeler, Two-wheeler,
            LCV, Mini-bus, Tempo-traveller, Bicycle, Van, Others]

pool:
  size: 4000                  # decide (Phase 1)
  smoke_size: 20              # CPU smoke tests
  require_both_labels: true   # ST labels cover only 81% of images; the ablation needs both

prepare:
  long_side: 1280
  jpeg_quality: 95

cluster:
  clip_model: openai/clip-vit-base-patch32
  batch_size: 32
  # Link two images when CLIP cosine >= clip_min (if set) AND thumbnail r >= r_min (if set).
  # Decided 2026-10-05 from results/phase1_sweep/ (rule B): no giant component, boundary pairs clean.
  link: {clip_min: 0.88, r_min: 0.7}

split:
  # Pre-purge targets. The purge moves ~40% of val/test into train; 60/20/20 lands near 76/12/12
  # and keeps test above min_test_images (decided 2026-10-05; 70/15/15 left test at 277-367).
  ratios: {train: 0.60, val: 0.20, test: 0.20}
  seed_search: 50             # try seeds seed..seed+49, keep the best class balance (label counts only)
  # Purge, applied inside every candidate split: a val/test image with a direct train partner at
  # CLIP >= clip_min AND r >= r_min is moved to train (one pass, direct pairs only). unit: group
  # moves the image's whole pseudo-camera so groups never straddle splits; unit: image moves it alone.
  purge: {clip_min: 0.85, r_min: 0.5, unit: group}
  min_test_images: 400        # if the chosen post-purge split has fewer test images, stop and ask
  min_test_instances: 30

train:
  model: yolov8s.pt           # always loaded by explicit path from weights_dir; never a default model
  imgsz: 960
  batch: 8
  epochs: 40                  # decide (Phase 2): set from the pilot so one run fits budget_minutes
  patience: 10
  freeze: null                # decide (Phase 2 pilot): 10 = backbone frozen, null = all trainable
  workers: 2
  save_period: 5
  deterministic: true
  cache: false                # Ultralytics warns cache='ram' is non-deterministic
  cls_remap: true             # Ultralytics 8.4 default, made explicit: seeds the Bus, Truck, Bicycle
                              # head rows from COCO by class name (same for baseline and ablation)
  pilot_epochs: 5             # Phase 2 freeze pilot length
  budget_minutes: 90          # one full training run must fit a free Colab T4 session

evaluate:
  iou_nms: 0.7
  conf_sweep: {start: 0.05, stop: 0.70, step: 0.05}
  conf: null                  # decide (Phase 4), frozen on val before the test set is opened
